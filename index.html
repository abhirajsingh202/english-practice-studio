<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>English Practice Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12303b;--mut:#51707b;--line:#d3e0e6;--ac:#0f7f82;--acink:#fff;--hl:#f6c453;--ok:#1b7f4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#17262e;--ink:#e6f0f3;--mut:#9db6bf;--line:#2a3f49;--ac:#4cc3c5;--acink:#08211f;--hl:#e0b13f;--ok:#58c98a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#17262e;--ink:#e6f0f3;--mut:#9db6bf;--line:#2a3f49;--ac:#4cc3c5;--acink:#08211f;--hl:#e0b13f;--ok:#58c98a;--bad:#ff8a80}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'Atkinson Hyperlegible',system-ui,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;overflow:auto;z-index:5}
.brand{font-weight:700;font-size:19px;padding:4px 10px 14px;line-height:1.2}.brand span{background:linear-gradient(transparent 58%,var(--hl) 58%)}
#side a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;margin:2px 0}
#side a:hover{background:var(--bg)}#side a[aria-current=page]{background:var(--ac);color:var(--acink);font-weight:700}
#top{display:none}
main{margin-left:236px;padding:28px clamp(16px,4vw,48px) 60px;max-width:1000px}
main:focus{outline:none}
h1{font-size:28px;margin:0 0 6px}h2{font-size:21px;margin:22px 0 8px}h3{margin:0 0 4px;font-size:18px}
.mut{color:var(--mut)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--ac)}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:30px;font-weight:700;line-height:1.1}
.btn{background:var(--ac);color:var(--acink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--bad);color:#fff}
.txt,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;max-width:520px}
textarea{min-height:150px;max-width:none;display:block}select{width:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tabs a{padding:6px 12px;border:1px solid var(--line);border-radius:20px;color:var(--ink);text-decoration:none;background:var(--card)}
.tabs a[aria-current=true]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.w{background:linear-gradient(transparent 55%,var(--hl) 55%);border:0;padding:0 2px;cursor:pointer;font:inherit;color:inherit}
.read{font-size:19px;line-height:1.85;max-width:68ch}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 14px}legend{font-weight:700;padding:0 6px}
.opt{display:block;padding:4px 0;cursor:pointer}.fb{margin:6px 0 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
#tg{font:20px/1.8 ui-monospace,Consolas,monospace;white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
#tg .ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}#tg .bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent);text-decoration:underline}#tg .cur{border-bottom:3px solid var(--hl)}
.note{border-left:4px solid var(--hl);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;margin:10px 0}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:2px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}#toast.on{opacity:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
@media(max-width:820px){#top{display:flex;position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;justify-content:space-between;align-items:center}
#side{transform:translateX(-100%);transition:transform .2s;width:80vw;max-width:300px}#side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}main{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const K='eps-v1',def=()=>({done:{},scores:{},typing:[],saved:[],seen:{},writing:[],days:{},theme:'',goal:45,plan:{},voice:''});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&typeof d==='object'&&!Array.isArray(d))return Object.assign(def(),d)}catch(e){}return def()})();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save. Browser storage is full or blocked.')}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)};
const act=()=>{S.days[td()]=Math.max(S.days[td()]||0,.5)};
setInterval(()=>{if(document.visibilityState==='visible'){S.days[td()]=(S.days[td()]||0)+.5;save()}},30000);
if(S.theme)document.documentElement.dataset.theme=S.theme;
function theme(){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';document.documentElement.dataset.theme=S.theme;save()}
const streak=()=>{let n=0,d=new Date();if(!(S.days[td()]>0))d.setDate(d.getDate()-1);for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(S.days[k]>0){n++;d.setDate(d.getDate()-1)}else return n}};
const cnt=p=>Object.keys(S.done).filter(k=>k.startsWith(p)).length;
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
/* ---------- speech ---------- */
const hasTTS='speechSynthesis' in window;
function say(t,r=1){if(!hasTTS){toast('This browser has no speech synthesis. Try Chrome or Edge.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;const v=speechSynthesis.getVoices().find(v=>v.name===S.voice);if(v)u.voice=v;speechSynthesis.speak(u)}
const sents=t=>t.match(/[^.?!]+[.?!]+/g).map(s=>s.trim());
/* ---------- content ---------- */
const R=[
{t:'A late bus',lv:'A2',tx:'Rina waited at the bus stop for twenty minutes. The bus was late again, and she was nervous because she had an important appointment at nine. She checked her phone and saw a message: a traffic jam on the main road had caused a delay. Rina decided to take an auto-rickshaw instead. It was more expensive, but she could not afford to miss the meeting. She arrived five minutes early and felt relieved.',
w:{nervous:['worried and a little afraid','घबराया हुआ','I feel nervous before exams.'],appointment:['a planned time to meet someone','अपॉइंटमेंट; मिलने का तय समय','I have a doctor’s appointment.'],delay:['when something happens later than planned','देरी','The rain caused a delay.'],afford:['to have enough money for something','खर्च उठा पाना','I can’t afford a new phone.'],relieved:['happy because a worry has gone','राहत महसूस करना','She felt relieved after the test.']},
q:[{q:'Why was Rina nervous?',o:['She was sick','She had an important appointment at nine','She lost her phone'],a:1,e:'The text says she had an important appointment. / उसकी नौ बजे ज़रूरी अपॉइंटमेंट थी।'},{q:'True or false: The bus came on time.',o:['True','False'],a:1,e:'The bus was late again. / बस फिर लेट थी।'},{q:'Rina took an ___ instead of the bus.',a:'auto-rickshaw|auto rickshaw|auto',e:'She chose an auto-rickshaw. / उसने ऑटो-रिक्शा लिया।'},{q:'How did Rina feel at the end?',o:['relieved','angry','bored'],a:0,e:'She arrived early and felt relieved. / वह समय पर पहुँचकर निश्चिंत हुई।'}]},
{t:'My Sunday diary',lv:'B1',tx:'Sunday, 18 October. Today I cleaned my room and organised my study table. I found an old notebook with my English notes from last year. I felt proud because my handwriting and my spelling have improved. In the evening I called my cousin and we talked about our plans for the festival. I want to practise speaking more, so I will record a short voice message every day.',
w:{organised:['put things in a neat order','व्यवस्थित किया','I organised my files.'],improved:['became better','बेहतर हुआ','My typing has improved.'],proud:['happy about something you did well','गर्व महसूस करना','She is proud of her son.'],practise:['to do something again and again to get better','अभ्यास करना','I practise English daily.'],plans:['things you decide to do in the future','योजनाएँ','What are your plans?']},
q:[{q:'What did the writer find?',o:['an old notebook','a new phone','a letter'],a:0,e:'She found an old notebook with English notes. / पुरानी नोटबुक मिली।'},{q:'She wants to record a short ___ message every day.',a:'voice',e:'A voice message helps speaking practice. / वॉइस मैसेज से बोलने का अभ्यास होता है।'},{q:'True or false: She called her teacher.',o:['True','False'],a:1,e:'She called her cousin. / उसने अपने कज़िन को फ़ोन किया।'}]},
{t:'At the clothes shop',lv:'B1',tx:'Customer: Excuse me, do you have this jacket in a larger size?\nAssistant: Let me check. Yes, we have a large, but it is not on discount.\nCustomer: How much is it?\nAssistant: It is 1,800 rupees.\nCustomer: That is a bit expensive. Can I see something cheaper?\nAssistant: Of course. This blue one is 1,200 rupees and it is on discount today.\nCustomer: I’ll take it. Can I have a receipt, please?',
w:{discount:['a lower price than usual','छूट','There is a discount on shoes.'],expensive:['costing a lot of money','महंगा','Gold is expensive.'],receipt:['a paper that shows you paid','रसीद','Keep the receipt.'],cheaper:['costing less money','और सस्ता','This bag is cheaper.']},
q:[{q:'Why does the customer ask for something cheaper?',o:['The jacket is too small','The first jacket is too expensive','The shop is closing'],a:1,e:'The customer says it is a bit expensive. / पहली जैकेट महंगी लगी।'},{q:'The blue jacket costs ___ rupees.',a:'1,200|1200',e:'It is 1,200 rupees. / नीली जैकेट 1,200 रुपये की है।'}]}];

{t:'Room for rent (phone call)',lv:'A2',tx:'Hello, this is Amit. I’m calling about the room for rent. Is it still available? Yes, it is. The rent is six thousand rupees a month. Can I visit it tomorrow evening? Sure, come at six.',d:'Can I visit it tomorrow evening?',q:[{q:'What is the monthly rent?',o:['Five thousand','Six thousand','Sixteen thousand'],a:1,e:'Listen for “six”, not “sixteen”. / “six” और “sixteen” में फ़र्क सुनें।'},{q:'When will Amit visit?',o:['Tomorrow evening','Today morning','On Sunday'],a:0,e:'He asks to visit tomorrow evening. / वह कल शाम जाएगा।'}]},
{t:'A trip to the hills',lv:'B1',tx:'Last summer, my family went to the hills. We left early in the morning because the road was long. On the way, our car stopped near a small village. A kind farmer helped us and gave us tea. We reached the hotel late at night, but we were very happy.',d:'A kind farmer helped us and gave us tea.',q:[{q:'Why did they leave early?',o:['The road was long','They were late','It was raining'],a:0,e:'“Because the road was long.” / रास्ता लंबा था।'},{q:'Who helped them?',o:['A mechanic','A farmer','A driver'],a:1,e:'A kind farmer helped them. / एक दयालु किसान ने मदद की।'}]},

const G=[
{t:'Present simple vs continuous',lv:'A2',ex:['I drink tea every morning. (habit)','I am drinking tea now. (happening now)','She works in a bank. (fact)'],x:'Use the <b>present simple</b> for habits and facts. Use the <b>present continuous</b> (am/is/are + verb-ing) for actions happening now. <span class="mut">हिंदी: आदत या सच्चाई के लिए present simple; अभी हो रहे काम के लिए present continuous।</span>',q:[{q:'She ___ to college by bus every day.',o:['goes','is going','go'],a:0,e:'“Every day” shows a habit, so use present simple. / रोज़ की आदत।'},{q:'Please be quiet. The baby ___.',o:['sleeps','is sleeping','sleep'],a:1,e:'The baby is sleeping right now. / अभी सो रहा है।'},{q:'They ___ football on Sundays.',o:['play','are playing','plays'],a:0,e:'“On Sundays” = habit; they + play. / हर रविवार की आदत।'},{q:'Look! It ___ (rain).',a:'is raining',e:'“Look!” means it is happening now. / अभी हो रहा है।'}]},
{t:'Articles: a, an, the',lv:'A2',ex:['I saw an elephant.','She is a teacher.','The sun is bright.'],x:'Use <b>a</b> before a consonant <i>sound</i>, <b>an</b> before a vowel <i>sound</i>, and <b>the</b> for something specific or known. <span class="mut">हिंदी: a/an किसी एक अनजान चीज़ के लिए; the किसी खास, जानी-पहचानी चीज़ के लिए।</span>',q:[{q:'I saw ___ elephant at the zoo.',o:['a','an','the'],a:1,e:'“Elephant” starts with a vowel sound → an. / स्वर की ध्वनि।'},{q:'My brother is ___ honest man.',o:['a','an','the'],a:1,e:'“Honest” starts with the vowel sound “o” (silent h). / h नहीं बोला जाता।'},{q:'___ sun rises in the east.',o:['A','An','The'],a:2,e:'There is only one sun, so use the. / सिर्फ़ एक सूरज।'},{q:'Please close ___ door.',a:'the',e:'A specific door both people know. / कोई खास दरवाज़ा।'}]},
{t:'Past simple',lv:'A2',ex:['I went to the market yesterday.','She lost her keys.','Did you see the film?'],x:'Use the <b>past simple</b> for finished actions. Regular verbs add -ed; many common verbs are irregular (go → went). After <b>did</b>, use the base verb. <span class="mut">हिंदी: बीते समय में पूरा हुआ काम; did के बाद verb का पहला रूप।</span>',q:[{q:'Yesterday I ___ to the market.',o:['go','went','gone'],a:1,e:'“Yesterday” + go → went. / go का past रूप went।'},{q:'She ___ her keys last night.',o:['lost','losed','lose'],a:0,e:'Lose is irregular: lose → lost. / अनियमित क्रिया।'},{q:'Did you ___ the film?',o:['saw','see','seen'],a:1,e:'After “did”, use the base verb: see. / did के बाद base verb।'},{q:'We ___ (eat) dinner at eight.',a:'ate',e:'Eat → ate (irregular). / eat का past ate।'}]}];

{t:'Vocabulary check',lv:'B1',q:[{q:'Which word means “a lower price than usual”?',o:['discount','receipt','luggage'],a:0,e:'Discount = छूट।'},{q:'The opposite of “expensive” is ___.',a:'cheap',e:'Cheap = सस्ता।'},{q:'True or false: “Delay” means to happen earlier than planned.',o:['True','False'],a:1,e:'Delay means later than planned. / देरी।'},{q:'A paper that shows you paid is a ___.',a:'receipt',e:'Receipt = रसीद।'},{q:'Spell it: “We will meet ___.” (the day after today)',a:'tomorrow',e:'Spelling: to-mor-row (one m, two r).'},{q:'“Improve” means ___.',o:['get better','get older','give up'],a:0,e:'Improve = सुधरना।'}]},

const V=[['borrow','to take something and give it back later','उधार लेना','Can I borrow your pen?','Opposite: lend'],['appointment','a planned time to meet someone','अपॉइंटमेंट','I have a dentist appointment at five.','Similar: meeting'],['schedule','a plan of times for things','समय-सारणी','My schedule is full today.','Similar: timetable'],['deadline','the last time to finish something','समय-सीमा','The deadline is Friday.','Similar: due date'],['improve','to become better','सुधारना','I want to improve my spelling.','Opposite: get worse'],['receipt','a paper that shows you paid','रसीद','Please keep the receipt.','Used when: shopping'],['luggage','bags you take when you travel','सामान','My luggage is heavy.','Similar: baggage'],['discount','a lower price than usual','छूट','There is a 20% discount.','Opposite: extra charge'],['journey','a long trip from one place to another','यात्रा','The journey took six hours.','Similar: trip'],['confident','sure about yourself','आत्मविश्वासी','I feel confident today.','Opposite: nervous'],['recommend','to say something is good','सिफ़ारिश करना','Can you recommend a book?','Similar: suggest'],['delay','later than planned','देरी','The flight has a delay.','Opposite: on time'],['give up','to stop trying','हार मान लेना','Don’t give up.','Opposite: keep going'],['look forward to','to wait happily for something','की प्रतीक्षा करना','I look forward to the trip.','Similar: be excited about'],['pick up','to collect someone or something','लेने जाना / उठाना','I will pick you up at six.','Opposite: drop off'],['turn down','to say no to an offer','ठुकराना','He turned down the job.','Opposite: accept']].map(a=>({w:a[0],s:a[1],h:a[2],e:a[3],x:a[4]}));

return `<h1>30-day B1 plan</h1><p class="mut">Steady practice builds improvement. It cannot promise fluency in 30 days.</p><div class="card"><label>Daily goal (minutes) <input class="txt" style="width:100px" type="number" min="15" max="180" value="${S.goal}" onchange="const v=+this.value;if(v<15||v>180){toast('Choose between 15 and 180 minutes.');this.value=S.goal;return}S.goal=v;save();route()"></label><p>Each day: <b>${m(10)} min</b> reading, <b>${m(10)}</b> listening, <b>${m(10)}</b> typing, <b>${m(10)}</b> writing, <b>${m(5)}</b> vocabulary or grammar.</p><a class="btn" href="#read">Reading</a><a class="btn" href="#listen">Listening</a><a class="btn" href="#type">Typing</a><a class="btn" href="#write">Writing</a><a class="btn" href="#vocab">Vocabulary</a></div><p>${Object.values(S.plan).filter(Boolean).length} of 30 days done</p><div class="grid">${days}</div>`};
P.progress=()=>{const ty=S.typing,avg=k=>ty.length?Math.round(ty.reduce((a,b)=>a+b[k],0)/ty.length):0,best=ty.length?Math.max(...ty.map(x=>x.wpm)):0,tot=Math.round(Object.values(S.days).reduce((a,b)=>a+b,0)),weak=ACT.filter(a=>S.scores[a.id]&&S.scores[a.id].s/S.scores[a.id].n<.7);
return `<h1>Progress</h1><div class="grid"><div class="card"><div class="big">${Object.keys(S.done).filter(k=>/^[rlgz]/.test(k)&&!/^d/.test(k)).length}</div>Lessons and quizzes done</div><div class="card"><div class="big">${tot} min</div>Time learning</div><div class="card"><div class="big">${streak()}</div>Day streak</div><div class="card"><div class="big">${best} WPM</div>Best typing (avg ${avg('wpm')} WPM, ${avg('acc')}% accurate)</div><div class="card"><div class="big">${Object.values(S.seen).filter(x=>x.ok).length}/${V.length}</div>Words known · ${S.saved.length} saved</div><div class="card"><div class="big">${S.writing.length}</div>Writing entries</div></div>
<h2>Scores</h2>${Object.keys(S.scores).length?`<table>${Object.keys(S.scores).map(k=>`<tr><td>${esc((ACT.find(a=>a.id===k)||{t:k}).t)}</td><td>${S.scores[k].s}/${S.scores[k].n}</td></tr>`).join('')}</table>`:'<p class="mut">No scores yet. Complete a quiz or lesson.</p>'}
<h2>Weak areas</h2>${weak.length?weak.map(a=>`<a class="chip" href="#${a.page}/${a.i}">Revise: ${esc(a.t)}</a>`).join(''):'<p class="mut">Nothing below 70% so far.</p>'}
<h2>Back up your progress</h2><div class="note">Progress lives in this browser on this device only. It can be lost if you clear browser data, and it does not sync between your laptop and phone. Export a backup now and then.</div><button class="btn" onclick="$('#ex').value=JSON.stringify(S);$('#ex').select();navigator.clipboard&&navigator.clipboard.writeText($('#ex').value).then(()=>toast('Copied. Paste it into a note to keep it.'),()=>toast('Select the text and copy it.'))">Export (copy JSON)</button><button class="btn alt" onclick="imp()">Import from box</button><textarea id="ex" aria-label="Progress JSON" placeholder="Export shows JSON here. To import, paste it here and choose Import."></textarea><p id="ie" role="status"></p>
<h2>Reset</h2><button class="btn danger" onclick="this.hidden=true;$('#rc').hidden=false">Reset all progress</button><span id="rc" hidden><b>This deletes everything.</b> <button class="btn danger" onclick="S=def();save();toast('Progress reset.');route()">Yes, delete</button><button class="btn alt" onclick="route()">Cancel</button></span>`};
function imp(){let d;try{d=JSON.parse($('#ex').value)}catch(e){$('#ie').innerHTML='<span class="bad">That is not valid JSON. Paste the exact exported text.</span>';return}const ok=d&&typeof d==='object'&&!Array.isArray(d)&&['done','scores','days','plan','seen'].every(k=>d[k]===undefined||(typeof d[k]==='object'&&d[k]&&!Array.isArray(d[k])))&&['typing','saved','writing'].every(k=>d[k]===undefined||Array.isArray(d[k]))&&(d.goal===undefined||(typeof d.goal==='number'&&d.goal>=15&&d.goal<=180));if(!ok){$('#ie').innerHTML='<span class="bad">This does not look like English Practice Studio progress. Nothing was changed.</span>';return}S=Object.assign(def(),d);save();toast('Progress imported.');route()}
route();
</script>
</body>
